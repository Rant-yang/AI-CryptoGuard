name: Verify clean Linux checkout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-and-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned application dependencies
        run: |
          python -m pip install --requirement setup/requirements-deploy.txt
          python -m pip check
      - name: Run offline contract and safety checks
        run: |
          python core/schema/selftest_v02.py
          python core/rules/algorithm_risk.py
          python core/rules/pqc_routing.py
          python -m core.usage_evidence_selftest
          python scanner/selftest.py
          python scanner/credential_selftest.py
          python scanner/selftest_crysentry.py
          python -m ai.selftest_v02
          python -m benchmark.ai_semantic_review_selftest
          python ai/selftest.py
          python core/selftest.py
          python -m core.report_selftest
          python repair/selftest.py
          python -m core.pipeline_ai_selftest
          python -m setup.package_selftest
          python web/server_selftest.py
      - name: Render committed public fixture in the Web viewer
        run: |
          mkdir -p out
          cp core/samples/example_finding.json out/ci-fixture.json
          node web/selftest.js ci-fixture.json
      - name: Prepare pinned external Linux scanners outside the checkout
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/acg-tools"
          mkdir -p "$tools/cryptoscan"
          curl --fail --location --retry 3 \
            'https://github.com/csnp/cryptoscan/releases/download/v1.4.0/cryptoscan_1.4.0_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/cryptoscan.tar.gz"
          printf '%s  %s\n' \
            '49aa043bd3f46927efa8ee89a2344d30f2ec351ae9e0cf2791ac8206b45be19d' \
            "$RUNNER_TEMP/cryptoscan.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/cryptoscan.tar.gz" -C "$tools/cryptoscan" cryptoscan
          chmod +x "$tools/cryptoscan/cryptoscan"
          git clone --depth 1 https://github.com/thefinalmilkman/cbom-scan.git "$tools/cbom-scan"
          test "$(git -C "$tools/cbom-scan" rev-parse HEAD)" = \
            'bcf71292816aa64d5890207466b5dff1f5ef9cf7'
          printf 'ACG_TOOLS_DIR=%s\n' "$tools" >> "$GITHUB_ENV"
      - name: Scan public example with real external tools on clean Linux
        run: |
          python setup/preflight.py --tools-dir "$ACG_TOOLS_DIR" \
            --target examples/repair_demo --mode fast
          python core/pipeline.py examples/repair_demo \
            --tools-dir "$ACG_TOOLS_DIR" -o "$RUNNER_TEMP/acg-ci-fast"
          python core/schema/validate_v02.py \
            "$RUNNER_TEMP/acg-ci-fast/findings_assessed.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'acg-ci-fast'
          task = json.loads((out / 'task.json').read_text(encoding='utf-8'))
          rows = json.loads((out / 'findings_assessed.json').read_text(encoding='utf-8'))
          stages = {stage['name']: stage['status'] for stage in task['stages']}
          assert stages['scan'] == stages['quantum_assessment'] == 'completed', stages
          assert stages['ai'] == 'skipped', stages
          assert len(rows) == 4, len(rows)
          assert sum(row.get('finding_kind') == 'credential' for row in rows) == 1
          print('Clean Linux public scan: 4 findings, one credential, quantum completed.')
          PY
      - name: Build deployment image from clean checkout
        run: docker build --file setup/Dockerfile --tag acg:ci .
      - name: Serve and scan through the Web UI in the built image
        run: |
          docker run --detach --name acg-ci -p 127.0.0.1:8765:8000 \
            --mount "type=bind,source=$ACG_TOOLS_DIR,target=/opt/acg-tools,readonly" \
            --mount 'type=volume,source=acg-ci-tasks,target=/app/workspace' \
            --read-only --tmpfs /tmp:size=256m acg:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/web/index.html > /dev/null; then
              python setup/compose_smoke.py --base http://127.0.0.1:8765
              exit $?
            fi
            sleep 2
          done
          docker logs acg-ci
          exit 1
      - name: Stop test container
        if: always()
        run: |
          docker rm --force acg-ci || true
          docker volume rm acg-ci-tasks || true
