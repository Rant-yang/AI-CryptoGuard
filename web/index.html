<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-CryptoGuard —— 密码安全审计</title>
<!--
  单文件查看器。零依赖、零构建、可离线 —— 演示现场不一定有网，
  所以这里不用任何 CDN（也不引 web font，字体全部取自系统）。

  它同时是**数据契约的验收工具**：契约里要求的字段在这里必须能渲染出来，
  渲染不出来的地方就是契约的缺口。

  特别地，schema README 规定「前端与报告必须把 decided:false 显示出来，
  不许静默填一个默认算法」—— 右侧「迁移 / 加固结论」区块就是在落实这条。
  四种「给不出结论」的原因分开显示，不糊成一句「需人工确认」。

  ── 视觉口径 ──
  浅色：答辩要投影，暗色 UI 在亮房间里暗部被压缩、发灰。
  等宽体是默认嗓音（算法名/路径/行号/计数都是标识符），中文散文才用无衬线。
  风险色按**成因**分，不按轻重：shor 与 broken 都是红，靠明度分开，
  且每个都带中文标签 —— 颜色永远不是唯一通道（色觉障碍/灰度打印下仍可读）。
-->
<style>
  :root{
    /* 纸面：规格文档的冷白，不是米色 */
    --paper:#f4f6f8; --surface:#fff;
    --rule:#dde2e8; --rule2:#edf0f3;
    --ink:#131a22; --ink2:#55606d; --ink3:#8a94a1;

    /* 风险 = 成因。亮/暗区分同为红色的 shor 与 broken。 */
    /* 都按「配白字 ≥4.5:1」选过 —— 条上要放白字 */
    --shor:#c93a2b; --broken:#7e2f24; --broken2:#66251b; --grover:#a0670a;
    --review:#5b6876; --safe:#2c7a55;

    /* 结论状态 */
    --ok:#2c7a55; --warn:#b57500; --info:#3d5a80; --mute:#6b7683;

    --mono:Consolas,"Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:14px/1.65 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .m{font-family:var(--mono)}
  .num{font-variant-numeric:tabular-nums}

  /* ============================ 报头 ============================ */
  header{
    background:var(--surface); border-bottom:1px solid var(--rule);
    padding:16px 22px 14px;
  }
  .hrow{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  header h1{
    margin:0; font-family:var(--mono); font-size:19px; font-weight:700;
    letter-spacing:-.3px;
  }
  header .role{font-size:13px; color:var(--ink2)}
  header .spacer{flex:1}
  .hmeta{
    margin-top:6px; font-family:var(--mono); font-size:12px; color:var(--ink3);
    display:flex; gap:0; flex-wrap:wrap;
  }
  .hmeta b{font-weight:700; color:var(--ink2)}
  .hmeta span+span::before{content:"/"; margin:0 9px; color:var(--rule)}

  /* ============================ 威胁构成（hero）============================ */
  .hero{background:var(--surface); border-bottom:1px solid var(--rule); padding:20px 22px 18px}
  .hero-top{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
  .hero-top h2{
    margin:0; font-family:var(--mono); font-size:12px; font-weight:600;
    color:var(--ink3); letter-spacing:.2px;
  }
  .hero-top .absent{
    margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink3);
  }
  .hero-top .tot{margin-left:16px; font-family:var(--mono); font-size:12px; color:var(--ink3)}
  .hero-top .tot b{font-size:15px; color:var(--ink)}

  /* 条与下方的机制行用**同一套 flex 比例 + 同一个 gap**，
     所以文字永远落在它自己那一段下面。改一处就得改两处。 */
  .strip{display:flex; gap:2px; height:58px; margin-bottom:9px}
  .seg{
    display:flex; flex-direction:column; justify-content:center; gap:1px;
    min-width:0; padding:0 14px; border-radius:2px; color:#fff; cursor:pointer;
    transform-origin:left center; animation:seg-in .45s cubic-bezier(.2,.7,.3,1) both;
  }
  .seg .n{font-family:var(--mono); font-size:21px; font-weight:700; line-height:1.15}
  .seg .cn{
    font-size:12.5px; font-weight:600; line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .seg:hover{filter:brightness(1.09)}
  .seg:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .seg.shor{background:var(--shor)}
  /* 斜纹：让「经典攻击已破」在灰度打印和色觉障碍下也和「量子直接破解」分得开。
     两者都是红，靠明度 + 纹理 + 文字三重区分。 */
  .seg.broken{
    background:repeating-linear-gradient(45deg,
      var(--broken) 0 5px, var(--broken2) 5px 10px);
  }
  .seg.grover{background:var(--grover)}
  .seg.review{background:var(--review)}
  .seg.safe{background:var(--safe)}
  @keyframes seg-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .mech{display:flex; gap:2px}
  .mcol{
    min-width:0; padding:0 14px; font-family:var(--mono); font-size:11.5px;
    color:var(--ink3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ============================ 统计横条 ============================ */
  .figs{
    background:var(--surface); border-bottom:1px solid var(--rule);
    padding:11px 22px; display:flex; gap:26px; flex-wrap:wrap; align-items:baseline;
    font-family:var(--mono); font-size:12px; color:var(--ink3);
  }
  .fig b{font-size:15px; color:var(--ink); font-weight:700; margin-right:5px}
  .fig.good b{color:var(--safe)}

  /* ============================ 筛选 ============================ */
  .filters{
    padding:11px 22px; background:var(--surface); border-bottom:1px solid var(--rule);
    display:flex; gap:16px; align-items:center; flex-wrap:wrap;
  }
  .filters input[type=search]{
    flex:0 1 230px; padding:6px 9px; border:1px solid var(--rule); border-radius:3px;
    font:13px var(--mono); background:var(--paper); color:var(--ink);
  }
  .filters input[type=search]:focus{outline:2px solid var(--info); outline-offset:-1px; background:var(--surface)}
  .fgroup{display:flex; gap:5px; align-items:center}
  .fgroup>.lbl{font-family:var(--mono); font-size:11.5px; color:var(--ink3); margin-right:3px}
  .chip{
    border:1px solid var(--rule); background:var(--paper); color:var(--ink2);
    border-radius:3px; padding:3px 9px; font:12px var(--sans); cursor:pointer;
    user-select:none;
  }
  .chip:hover{border-color:var(--ink3)}
  .chip:focus-visible{outline:2px solid var(--info); outline-offset:1px}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .chip .n{font-family:var(--mono); opacity:.55; margin-left:5px}
  .chip.on .n{opacity:.7}
  .clearbtn{background:none; border:0; color:var(--ink3); font:12px var(--sans);
            cursor:pointer; padding:3px 2px; text-decoration:underline}
  .clearbtn:hover{color:var(--ink)}

  /* ============================ 主体 ============================ */
  main{display:flex; height:calc(100vh - 300px); min-height:360px}
  .list{flex:1 1 54%; overflow:auto; border-right:1px solid var(--rule); background:var(--surface)}
  .detail{flex:1 1 46%; overflow:auto; background:var(--paper)}
  @media (max-width:1000px){ main{flex-direction:column; height:auto} .list,.detail{flex:none} }

  table{width:100%; border-collapse:collapse}
  thead th{
    position:sticky; top:0; z-index:1; background:var(--surface);
    border-bottom:1px solid var(--ink3); padding:7px 9px; text-align:left;
    font-family:var(--mono); font-size:11.5px; color:var(--ink3); font-weight:600;
    cursor:pointer; white-space:nowrap;
  }
  thead th:hover{color:var(--ink)}
  tbody tr{border-bottom:1px solid var(--rule2); cursor:pointer}
  tbody tr:hover{background:var(--paper)}
  tbody tr.sel{background:#eaf1fb; box-shadow:inset 3px 0 0 var(--info)}
  tbody td{padding:6px 9px; vertical-align:middle; font-size:13px}
  .alg{font-family:var(--mono); font-weight:600; font-size:12.5px}
  .loc{font-family:var(--mono); font-size:11.5px; color:var(--ink3)}

  /* ============================ 标记 ============================ */
  /* 风险标记：左侧色块 + 文字。色块用明度区分同为红色的两种成因。 */
  .rk{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-size:12px}
  .rk i{width:3px; height:14px; border-radius:1px; flex:none; display:block}
  .rk.shor   i{background:var(--shor)}   .rk.shor   {color:var(--shor)}
  .rk.broken i{background:var(--broken)} .rk.broken {color:var(--broken); opacity:.92}
  .rk.grover i{background:var(--grover)} .rk.grover {color:var(--grover)}
  .rk.review i{background:var(--review)} .rk.review {color:var(--review)}
  .rk.safe   i{background:var(--safe)}   .rk.safe   {color:var(--safe)}

  .tag{
    display:inline-block; border:1px solid var(--rule); border-radius:3px;
    padding:1px 6px; font-size:11.5px; color:var(--ink2); white-space:nowrap;
    background:var(--paper);
  }
  .tag.solid{background:var(--ink); color:#fff; border-color:var(--ink)}
  .tag.ok{color:var(--ok); border-color:#bcdcc9; background:#eef7f1}
  .tag.undet{color:var(--info); border-color:#c3d2e4; background:#eef3f8}
  .tag.warn{color:var(--warn); border-color:#e6d3a8; background:#fdf6e7}
  .tag.mute{color:var(--mute)}
  .sv{font-family:var(--mono); font-size:11px; padding:1px 5px; border-radius:3px;
      white-space:nowrap; letter-spacing:.2px}
  .sv.critical{background:#fbe9e7; color:#a3271a; font-weight:700}
  .sv.high{background:#fdeee2; color:#9a4a08}
  .sv.medium{background:#fbf3dc; color:#7a5a06}
  .sv.low{background:#eef1f5; color:#4d5765}
  .sv.info{background:#f3f5f7; color:#78828e}

  /* ============================ 详情 ============================ */
  .dwrap{padding:20px 22px 48px}
  .dhead h2{margin:0 0 3px; font-family:var(--mono); font-size:20px; letter-spacing:-.3px}
  .dhead .path{font-family:var(--mono); font-size:12px; color:var(--ink3); word-break:break-all}
  .drow{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; align-items:center}

  section.blk{margin-top:22px}
  section.blk>h3{
    margin:0 0 9px; padding-bottom:5px; border-bottom:1px solid var(--rule);
    font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--ink3);
  }
  .box{background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:12px 14px}

  .verdict{border-left:3px solid var(--mute); border-radius:0 3px 3px 0}
  .verdict.v-ok{border-left-color:var(--ok)}
  .verdict.v-undet{border-left-color:var(--info)}
  .verdict.v-warn{border-left-color:var(--warn)}
  .verdict .why{font-size:12.5px; color:var(--ink2); margin-top:9px; line-height:1.6}
  .verdict .txt{margin-top:9px; font-size:14px}
  .refs{display:flex; gap:5px; flex-wrap:wrap; margin-top:11px}
  .ref{
    font-family:var(--mono); font-size:11px; color:var(--ink2);
    background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:1px 6px;
  }

  .ev{margin-top:9px}
  .ev .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .ev .tool{font-family:var(--mono); font-weight:600; font-size:12.5px}
  .ev .ln{font-family:var(--mono); font-size:11.5px; color:var(--ink3)}
  .shapes{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
  .shape{
    font-family:var(--mono); font-size:11.5px; color:var(--ink2);
    background:var(--paper); border:1px solid var(--rule); border-radius:3px; padding:1px 6px;
  }
  .shape.hit{font-weight:600; color:var(--ink); background:#eef3f8; border-color:#ccd9e6}
  .ctx{
    margin-top:8px; background:#1b2028; color:#cfd7e0; border-radius:3px;
    padding:8px 11px; font:12px/1.55 var(--mono); overflow-x:auto; white-space:pre;
  }
  pre.raw{
    margin:8px 0 0; background:var(--paper); border:1px solid var(--rule2); border-radius:3px;
    padding:9px 11px; font:11.5px/1.55 var(--mono); color:var(--ink2);
    overflow-x:auto; max-height:190px;
  }
  .empty{color:var(--ink3); padding:44px 22px; text-align:center; font-size:13px}
  .fid{
    font-family:var(--mono); font-size:11px; color:var(--ink3);
    margin-top:24px; padding-top:10px; border-top:1px solid var(--rule);
  }

  /* ============================ 拖入数据 ============================ */
  #drop{
    position:fixed; inset:0; background:rgba(244,246,248,.97); display:none;
    align-items:center; justify-content:center; z-index:9; padding:20px;
  }
  #drop.on{display:flex}
  #drop .inner{
    max-width:540px; padding:32px 34px; background:var(--surface);
    border:1px solid var(--rule); border-radius:3px;
  }
  #drop h2{margin:0 0 12px; font-size:17px}
  #drop p{color:var(--ink2); margin:8px 0; font-size:13.5px}
  #drop code{font-family:var(--mono); background:var(--paper); padding:2px 6px;
             border-radius:3px; font-size:12.5px; border:1px solid var(--rule)}
  .btn{
    display:inline-block; margin-top:16px; padding:7px 15px; border-radius:3px;
    background:var(--ink); color:#fff; cursor:pointer; font-size:13px; border:0;
    font-family:var(--sans);
  }
  .btn:hover{background:#000}
  .sortmark{font-size:9px; opacity:.6; margin-left:2px}

  @media (prefers-reduced-motion:reduce){
    .seg{animation:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>AI-CryptoGuard</h1>
    <span class="role">基于多源证据融合与大模型推理的密码安全审计</span>
    <span class="spacer"></span>
    <button class="chip" id="reload">换一份数据</button>
  </div>
  <div class="hmeta" id="hmeta"></div>
</header>

<div class="hero" id="stats"></div>
<div class="figs" id="figs"></div>
<div class="filters" id="filters"></div>

<main>
  <div class="list" id="list"><div class="empty">载入中…</div></div>
  <div class="detail" id="detail">
    <div class="empty">从左侧选一条问题，这里显示它的证据、AI 解释与迁移建议。</div>
  </div>
</main>

<div id="drop">
  <div class="inner">
    <h2>没有自动读到数据</h2>
    <p>直接打开 HTML 文件时，浏览器不允许读取本地文件 —— 这是浏览器的限制，不是程序出错。</p>
    <p>两种办法，任选一种：</p>
    <p><b>①</b> 在仓库根目录跑 <code>python web/serve.py</code>，它会自动打开页面。</p>
    <p><b>②</b> 直接把 <code>findings_ai.json</code> 拖到本窗口。</p>
    <input type="file" id="picker" accept=".json" style="display:none">
    <button class="btn" id="pick">选择 JSON 文件</button>
  </div>
</div>

<script>
'use strict';

/* ============================ 数据载入 ============================ */

const CANDIDATES = [
  './findings_ai.json',
  '../out/findings_ai.json',
  '../out/findings.json',
  'findings.json',
];

async function autoLoad(){
  for (const url of CANDIDATES){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) continue;
      const data = await r.json();
      if(Array.isArray(data)) return {rows:data, from:url};
    }catch(e){ /* file:// 会在这里抛，走手动分支 */ }
  }
  return null;
}

/* ============================ 常 量 ============================ */

const RISKS = ['shor','broken','grover','review','safe'];
const RISK_CN = {shor:'量子直接破解', broken:'经典攻击已破', grover:'量子加速削弱',
                 review:'待评估', safe:'无已知威胁'};
/* 每类成因的机制。broken 那条是本项目的核心主张：
   上游把 MD5 之流判成「量子脆弱」，但它其实是被经典攻击攻破的，与量子无关。 */
const RISK_MECH = {shor:'Shor 可恢复私钥', broken:'与量子无关', grover:'Grover 使强度减半',
                   review:'证据不足以判定', safe:'当前无已知攻击'};

const SEVS = ['critical','high','medium','low','info'];
const SEV_CN = {critical:'严重', high:'高', medium:'中', low:'低', info:'提示'};

// 四种「给不出结论」分开表述 —— 这是契约要求的核心区分，
// 不能糊成一句「需人工确认」。
const REASONS = ['decided','usage-undetermined','not-an-algorithm',
                 'rule-missing','not-enriched'];
const REASON_META = {
  'decided':           {cn:'已给结论',   cls:'tag ok',   tone:'v-ok',
                        why:'规则库已给出确定的迁移或加固建议。'},
  'usage-undetermined':{cn:'用途待定',   cls:'tag undet',tone:'v-undet',
                        why:'算法用途无法从证据判定。方案 §9.1 明确禁止在用途未知时给出固定映射 —— 这是正确行为，不是缺陷。'},
  'not-an-algorithm':  {cn:'非算法命中', cls:'tag mute', tone:'v-warn',
                        why:'上游命中的是密码库名 / Provider 名 / 配置项，不是具体算法。需要展开到实际调用的算法才能判断。'},
  'rule-missing':      {cn:'规则库未覆盖',cls:'tag warn',tone:'v-warn',
                        why:'规则库中没有该算法。这是待补的缺口 —— 扩充 core/rules/ 即可，不需要重跑大模型。'},
  'not-enriched':      {cn:'尚未增强',   cls:'tag mute', tone:'v-warn',
                        why:'这一条还没有经 ai/ 层处理（来源是 scanner 的占位符）。'},
};

const USAGE_CN = {
  signing:'签名', encryption:'加密', key_exchange:'密钥交换', hashing:'哈希',
  authentication:'认证', tls_configuration:'TLS 配置', unknown:'未知',
};

function reasonOf(f){
  const r = f.remediation || {};
  return r.reason || (r.source === 'none' ? 'not-enriched' : null);
}

/* ============================ 状 态 ============================ */

const S = {
  rows: [], view: [], sel: null, src: '',
  q: '',
  risk: new Set(), sev: new Set(), usage: new Set(), reason: new Set(),
  sort: {key:'risk', dir:1},
};

/* ============================ 工 具 ============================ */

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function riskRank(r){ return RISKS.indexOf(r) < 0 ? 99 : RISKS.indexOf(r); }
function sevRank(s){ return SEVS.indexOf(s) < 0 ? 99 : SEVS.indexOf(s); }
function riskCls(r){ return RISKS.indexOf(r) < 0 ? 'review' : r; }

function countBy(rows, fn){
  const m = new Map();
  for(const r of rows){ const k = fn(r); m.set(k, (m.get(k)||0)+1); }
  return m;
}

/* ============================ 威胁构成（hero）============================
 * 整幅审计按**成因**一次铺开。段宽按条数，标签与机制直接落在段下，
 * 不另设图例 —— 这张图自己就是自己的键。
 * 点一段即筛选。
 */

function renderStats(){
  const rows = S.rows;
  const total = rows.length;
  const R = countBy(rows, f => f.risk);
  const present = RISKS.filter(k => R.has(k));
  const absent  = RISKS.filter(k => !R.has(k));

  // 条与机制行共用同一套 flex 比例，文字才落得准
  const segs = present.map((k,i) => `
    <span class="seg ${riskCls(k)}" data-risk="${esc(k)}" tabindex="0"
          title="只看「${esc(RISK_CN[k])}」"
          style="flex:${R.get(k)} 1 0;animation-delay:${i*55}ms">
      <span class="n">${R.get(k)}</span>
      <span class="cn">${esc(RISK_CN[k])}</span>
    </span>`).join('');

  const mech = present.map(k =>
    `<span class="mcol" style="flex:${R.get(k)} 1 0">${esc(RISK_MECH[k])}</span>`).join('');

  $('#stats').innerHTML = `
    <div class="hero-top">
      <h2>威胁构成</h2>
      ${absent.length
        ? `<span class="absent">未出现：${absent.map(k=>esc(RISK_CN[k])).join('、')}</span>`
        : ''}
      <span class="tot"><b>${total}</b> 条</span>
    </div>
    <div class="strip">${segs}</div>
    <div class="mech">${mech}</div>`;

  $('#stats').querySelectorAll('.seg').forEach(el => {
    el.onclick = () => {
      S.risk.clear(); S.risk.add(el.dataset.risk);
      renderFilters(); apply();
    };
  });
}

/* ============================ 统计横条 ============================ */

/* 报头讲**范围与出处**（几条、几个文件、数据来自哪），
   这一行讲**分析质量** —— 两处不重复同一个数字。 */
function renderFigs(){
  const rows = S.rows;
  const decided = rows.filter(f => (f.remediation||{}).decided).length;
  const multi = rows.filter(f => (f.evidence||[]).length > 1).length;
  const pct = rows.length ? Math.round(decided/rows.length*100) : 0;

  $('#figs').innerHTML = `
    <span class="fig"><b>${multi}</b>条多源交叉</span>
    <span class="fig good"><b>${decided}</b>条已给结论（${pct}%）</span>`;
}

/* ============================ 筛 选 ============================ */

function renderFilters(){
  const R = countBy(S.rows, f => f.risk);
  const V = countBy(S.rows, f => f.severity);
  const U = countBy(S.rows, f => f.usage);
  const N = countBy(S.rows, f => reasonOf(f));

  const CN = {
    risk: RISK_CN, sev: SEV_CN, usage: USAGE_CN,
    reason: Object.fromEntries(REASONS.map(k=>[k, REASON_META[k].cn])),
  };
  const SRC = {risk:R, sev:V, usage:U, reason:N};
  const SET = {risk:S.risk, sev:S.sev, usage:S.usage, reason:S.reason};

  const group = (lbl, keys, set) => `
    <div class="fgroup"><span class="lbl">${lbl}</span>${
      keys.filter(k => SRC[set].has(k)).map(k => {
        const on = SET[set].has(k);
        return `<span class="chip${on?' on':''}" data-set="${set}" data-k="${esc(k)}"
                      tabindex="0">${esc(CN[set][k]||k)}<span class="n">${SRC[set].get(k)}</span></span>`;
      }).join('')}</div>`;

  $('#filters').innerHTML = `
    <input type="search" id="q" placeholder="搜算法 / 文件 / 行号…" value="${esc(S.q)}">
    ${group('风险', RISKS, 'risk')}
    ${group('状态', REASONS, 'reason')}
    ${group('用途', Object.keys(USAGE_CN), 'usage')}
    ${group('严重', SEVS, 'sev')}
    <span class="spacer" style="flex:1"></span>
    <button class="clearbtn" id="clr">清空筛选</button>`;

  $('#q').oninput = e => { S.q = e.target.value; apply(); };
  $('#clr').onclick = () => {
    S.q=''; S.risk.clear(); S.sev.clear(); S.usage.clear(); S.reason.clear();
    renderFilters(); apply();
  };
  $('#filters').querySelectorAll('.chip[data-set]').forEach(el => {
    el.onclick = () => {
      const target = SET[el.dataset.set];
      const k = el.dataset.k;
      target.has(k) ? target.delete(k) : target.add(k);
      renderFilters(); apply();
    };
  });
}

/* ============================ 筛 + 排 ============================ */

function apply(){
  const q = S.q.trim().toLowerCase();
  S.view = S.rows.filter(f => {
    if(S.risk.size   && !S.risk.has(f.risk)) return false;
    if(S.sev.size    && !S.sev.has(f.severity)) return false;
    if(S.usage.size  && !S.usage.has(f.usage)) return false;
    if(S.reason.size && !S.reason.has(reasonOf(f))) return false;
    if(q){
      const hay = [f.algorithm, f.algorithm_normalized, f.file, f.line,
                   f.usage, f.explanation, (f.tags||[]).join(' ')]
                  .join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const {key, dir} = S.sort;
  S.view.sort((a,b) => {
    let x, y;
    if(key==='risk'){ x=riskRank(a.risk); y=riskRank(b.risk); }
    else if(key==='severity'){ x=sevRank(a.severity); y=sevRank(b.severity); }
    else if(key==='algorithm'){ x=a.algorithm||''; y=b.algorithm||''; }
    else if(key==='file'){ x=(a.file||'')+a.line; y=(b.file||'')+b.line; }
    else if(key==='decided'){ x=(a.remediation||{}).decided?0:1; y=(b.remediation||{}).decided?0:1; }
    else { x=a[key]||''; y=b[key]||''; }
    if(x<y) return -dir; if(x>y) return dir; return 0;
  });

  renderList();
}

/* ============================ 列 表 ============================
 * 结论状态**在这一层就可见** —— 不藏在详情里。
 * 通用工具会把「答不上来」藏起来；我们把它摆出来。
 */

function renderList(){
  const rows = S.view;
  if(!rows.length){
    $('#list').innerHTML = '<div class="empty">没有符合条件的问题。</div>';
    return;
  }
  const sm = k => S.sort.key===k ? `<span class="sortmark">${S.sort.dir>0?'▲':'▼'}</span>` : '';
  const th = (k,label,align) =>
    `<th data-k="${k}"${align?` style="text-align:${align}"`:''}>${label}${sm(k)}</th>`;

  const body = rows.map((f,i) => {
    const rs = reasonOf(f);
    const meta = REASON_META[rs] || {cn: rs||'—', cls:'tag mute'};
    const sel = S.sel && S.sel.finding_id === f.finding_id;
    const rk = riskCls(f.risk);
    return `<tr data-i="${i}" class="${sel?'sel':''}">
      <td><span class="rk ${rk}"><i></i>${esc(RISK_CN[f.risk]||f.risk||'—')}</span></td>
      <td class="alg">${esc(f.algorithm||'—')}</td>
      <td class="loc" title="${esc(f.file)}">${esc((f.file||'').split(/[\\/]/).pop())}:${esc(f.line)}</td>
      <td><span class="tag">${esc(USAGE_CN[f.usage]||f.usage||'—')}</span></td>
      <td><span class="sv ${esc(f.severity||'info')}">${esc(SEV_CN[f.severity]||f.severity||'—')}</span></td>
      <td><span class="${meta.cls}">${esc(meta.cn)}</span></td>
      <td class="loc" style="text-align:right">${(f.evidence||[]).length}</td>
    </tr>`;
  }).join('');

  $('#list').innerHTML = `<table>
    <thead><tr>
      ${th('risk','风险')}${th('algorithm','算法')}${th('file','位置')}
      ${th('usage','用途')}${th('severity','严重')}${th('decided','结论')}
      ${th('evidence','证据','right')}
    </tr></thead>
    <tbody>${body}</tbody></table>`;

  $('#list').querySelectorAll('tbody tr').forEach(tr => {
    tr.onclick = () => { S.sel = S.view[+tr.dataset.i]; renderList(); renderDetail(); };
  });
  $('#list').querySelectorAll('thead th').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.k;
      S.sort = {key:k, dir: S.sort.key===k ? -S.sort.dir : 1};
      apply();
    };
  });
}

/* ============================ 详 情 ============================ */

function renderDetail(){
  const f = S.sel;
  if(!f){
    $('#detail').innerHTML =
      '<div class="empty">从左侧选一条问题，这里显示它的证据、AI 解释与迁移建议。</div>';
    return;
  }
  const r = f.remediation || {};
  const rs = reasonOf(f);
  const meta = REASON_META[rs] || {cn: rs||'—', cls:'tag mute', tone:'v-warn', why:''};
  const rk = riskCls(f.risk);

  const evHtml = (f.evidence||[]).map((e, evidenceIndex) => {
    const up = e.raw || {};
    const lines = (e.lines||[]);
    const shown = lines.slice(0, 40).map(n=>`<span class="shape">${esc(n)}</span>`).join('');
    const more = lines.length > 40 ? `<span class="ln">…共 ${esc(lines.length)} 行</span>` : '';
    const shapes = (e.call_shape||[]).map(s=>`<span class="shape hit">${esc(s)}</span>`).join('');
    const ctx = (e.call_context||[]).map(c=>`<div class="ctx">${esc(c)}</div>`).join('');
    return `<div class="box ev">
      <div class="top">
        <span class="ref">E${evidenceIndex + 1}</span>
        <span class="tool">${esc(e.tool||'—')}</span>
        <span class="tag">${esc(e.kind||'pattern')}</span>
        <span class="ln">命中 ${esc(lines.length)} 处</span>
        ${up.prim ? `<span class="tag">prim: ${esc(up.prim)}</span>` : ''}
      </div>
      <div class="shapes">${shown}${more}</div>
      ${shapes ? `<div class="shapes">${shapes}</div>` : ''}
      ${ctx}
      ${Object.keys(up).length ? `<pre class="raw">${esc(JSON.stringify(up, null, 2))}</pre>` : ''}
    </div>`;
  }).join('') || '<div class="box"><span class="loc">（无证据）</span></div>';

  $('#detail').innerHTML = `<div class="dwrap">
    <div class="dhead">
      <h2>${esc(f.algorithm||'—')}</h2>
      <div class="path">${esc(f.file)}:${esc(f.line)}</div>
      <div class="drow">
        <span class="rk ${rk}"><i></i>${esc(RISK_CN[f.risk]||f.risk||'—')}</span>
        <span class="sv ${esc(f.severity||'info')}">${esc(SEV_CN[f.severity]||f.severity||'—')}</span>
        <span class="tag">用途 · ${esc(USAGE_CN[f.usage]||f.usage||'—')}</span>
        ${f.confidence!=null ? `<span class="tag">置信 ${esc(f.confidence)}</span>` : ''}
        ${(f.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
      </div>
    </div>

    <section class="blk">
      <h3>迁移 / 加固结论</h3>
      <div class="box verdict ${meta.tone}">
        <span class="${meta.cls}">${esc(meta.cn)}</span>
        ${r.decided === false ? '<span class="tag mute">decided: false</span>' : ''}
        ${r.source ? `<span class="tag mute">source: ${esc(r.source)}</span>` : ''}
        ${meta.why ? `<div class="why">${esc(meta.why)}</div>` : ''}
        <div class="txt">${esc(r.action || '（无建议文本）')}</div>
        ${(r.references||[]).length
          ? `<div class="refs">${r.references.map(x=>`<span class="ref">${esc(x)}</span>`).join('')}</div>`
          : ''}
      </div>
    </section>

    <section class="blk">
      <h3>AI 解释</h3>
      <div class="box">
        ${ex_or(f.explanation)}
        ${(f.evidence_refs||[]).length
          ? `<div class="refs"><span class="loc">引用证据：</span>${f.evidence_refs.map(x=>`<span class="ref">${esc(x)}</span>`).join('')}</div>`
          : ''}
      </div>
    </section>

    <section class="blk">
      <h3>证据（${(f.evidence||[]).length} 个来源）</h3>
      ${evHtml}
    </section>

    <div class="fid">finding_id: ${esc(f.finding_id)} / schema ${esc(f.schema_version)}</div>
  </div>`;
}

/* 没经 ai/ 层处理时要如实说，不能装作有结论 */
function ex_or(x){
  return x ? esc(x) : '<span class="loc">尚未生成 —— 这一条还没经 ai/ 层处理。</span>';
}

/* ============================ 载入入口 ============================ */

function boot(rows, from){
  S.rows = rows.filter(f => f && typeof f === 'object');
  S.src = from;
  const files = new Set(S.rows.map(f => f.file)).size;
  $('#hmeta').innerHTML =
    `<span><b>${S.rows.length}</b> 条发现</span>` +
    `<span><b>${files}</b> 个文件</span>` +
    `<span>${esc(from)}</span>`;
  $('#drop').classList.remove('on');
  renderStats(); renderFigs(); renderFilters(); apply(); renderDetail();
  if(S.rows.length) { S.sel = S.view[0]; renderList(); renderDetail(); }
}

async function start(){
  const got = await autoLoad();
  if(got) return boot(got.rows, got.from);
  $('#drop').classList.add('on');
}

function readFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      boot(Array.isArray(d) ? d : [d], file.name);
    }catch(e){ alert('这个文件不是合法的 JSON：' + e.message); }
  };
  fr.readAsText(file, 'utf-8');
}

$('#pick').onclick = () => $('#picker').click();
$('#picker').onchange = e => { if(e.target.files[0]) readFile(e.target.files[0]); };
$('#reload').onclick = () => $('#drop').classList.add('on');
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

start();
</script>
</body>
</html>
